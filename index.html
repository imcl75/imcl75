<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools — IM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Tokens ─────────────────────────────────────────── */
    :root {
      --bg:        #F4F5F7;
      --surface:   #FFFFFF;
      --border:    #DDE1EB;
      --text:      #1A2030;
      --muted:     #7A8499;
      --accent:    #2E5F8A;
      --accent-lo: #EBF1F8;
      --chip-bg:   #ECEEF3;
      --chip-txt:  #5C6880;
      --shadow:    rgba(26, 32, 48, 0.07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #0F1520;
        --surface:   #192030;
        --border:    #242E42;
        --text:      #DEE5F2;
        --muted:     #7A8AA8;
        --accent:    #5090C0;
        --accent-lo: #152030;
        --chip-bg:   #1D2840;
        --chip-txt:  #8099BF;
        --shadow:    rgba(0, 0, 0, 0.25);
      }
    }
    :root[data-theme="dark"] {
      --bg:        #0F1520;
      --surface:   #192030;
      --border:    #242E42;
      --text:      #DEE5F2;
      --muted:     #7A8AA8;
      --accent:    #5090C0;
      --accent-lo: #152030;
      --chip-bg:   #1D2840;
      --chip-txt:  #8099BF;
      --shadow:    rgba(0, 0, 0, 0.25);
    }
    :root[data-theme="light"] {
      --bg:        #F4F5F7;
      --surface:   #FFFFFF;
      --border:    #DDE1EB;
      --text:      #1A2030;
      --muted:     #7A8499;
      --accent:    #2E5F8A;
      --accent-lo: #EBF1F8;
      --chip-bg:   #ECEEF3;
      --chip-txt:  #5C6880;
      --shadow:    rgba(26, 32, 48, 0.07);
    }

    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Figtree', system-ui, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    /* ── Wrapper ─────────────────────────────────────────── */
    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 22px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      padding: 52px 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .identity {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .badge {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      flex-shrink: 0;
    }
    .id-text { display: flex; flex-direction: column; gap: 1px; }
    .id-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      line-height: 1.2;
      color: var(--text);
    }
    .id-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .theme-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 1rem;
      color: var(--muted);
      line-height: 1;
      transition: border-color 0.15s, color 0.15s;
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
    .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Rule ─────────────────────────────────────────────── */
    .rule {
      border: none;
      border-top: 1.5px solid var(--border);
      margin-bottom: 36px;
    }

    /* ── Grid ─────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
      gap: 14px;
      margin-bottom: auto;
      padding-bottom: 52px;
    }

    /* ── Card ─────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
    }
    .card::after {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--accent);
      border-radius: 12px 0 0 12px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 6px 24px var(--shadow);
      transform: translateY(-2px);
    }
    .card:hover::after { opacity: 1; }

    .chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.67rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--chip-txt);
      background: var(--chip-bg);
      border-radius: 5px;
      padding: 3px 7px;
      width: fit-content;
    }
    .card-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      line-height: 1.25;
      color: var(--text);
      text-wrap: balance;
    }
    .card-desc {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.58;
      flex: 1;
    }
    .card-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 2px;
      transition: gap 0.15s;
    }
    .card-link:hover { gap: 8px; }
    .card-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

    /* ── Footer ──────────────────────────────────────────── */
    footer {
      border-top: 1.5px solid var(--border);
      padding: 16px 0 24px;
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 500px) {
      header { flex-direction: column; align-items: flex-start; gap: 14px; padding-top: 36px; }
      .grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .card-link, .card::after { transition: none; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="identity">
      <div class="badge">IM</div>
      <div class="id-text">
        <span class="id-title">Personal Tools</span>
        <span class="id-sub">imcl75.github.io</span>
      </div>
    </div>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle colour scheme">◐</button>
  </header>

  <hr class="rule">

  <div class="grid">

    <div class="card">
      <span class="chip">filesystem</span>
      <div class="card-name">Folder Creator</div>
      <p class="card-desc">Build nested folder structures with numbered or named levels. Set different subjects at different depths — then create everything in one go or download a shell script.</p>
      <a class="card-link" href="folder-creator/">
        Open <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true"><path d="M1.5 6.5h10M6.5 1.5l5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

  </div>

  <footer>
    <span>26.07.26b</span>
    <span>personal use only</span>
  </footer>

</div>
<script>
  function toggleTheme() {
    const root = document.documentElement;
    const current = root.getAttribute('data-theme');
    const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    root.setAttribute('data-theme', current ? (current === 'dark' ? 'light' : 'dark') : (sys === 'dark' ? 'light' : 'dark'));
  }
</script>
</body>
</html>
