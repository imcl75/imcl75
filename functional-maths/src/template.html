<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Functional Maths L2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: WFA shell (blue top bar, Nunito), one centred column of cards; topic areas colour-coded */
:root{
  --blue:#1798d3; --blue-d:#0f6e9c; --soft:#eef6fb;
  --bg:#f6f9fb; --card:#ffffff; --ink:#14232e; --muted:#5a6b78; --line:#d9e5ee; --shape:#e3f1fa;
  --num:#1798d3; --mea:#0f9a83; --dat:#7a5ad6;
  --good:#1f8f4e; --good-bg:#e7f6ee; --bad:#c43d3d; --bad-bg:#fbeaea; --warn:#b8770b; --warn-bg:#fdf3e1;
  --focus:#ffbf47;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a22; --card:#16242f; --ink:#e7f0f6; --muted:#9db0be; --line:#2a3c4a; --shape:#1c3444; --soft:#173041;
  --good:#5fcf8e; --good-bg:#15301f; --bad:#ff8a8a; --bad-bg:#3a1c1e; --warn:#f0b45a; --warn-bg:#352813; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a22; --card:#16242f; --ink:#e7f0f6; --muted:#9db0be; --line:#2a3c4a; --shape:#1c3444; --soft:#173041;
  --good:#5fcf8e; --good-bg:#15301f; --bad:#ff8a8a; --bad-bg:#3a1c1e; --warn:#f0b45a; --warn-bg:#352813; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.55 var(--font)}
a{color:var(--blue-d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) a{color:#6cc3ec}}
:root[data-theme="dark"] a{color:#6cc3ec}
h1,h2,h3,h4{font-weight:900;line-height:1.2;text-wrap:balance;margin:0 0 .4em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* top bar */
#top{background:var(--blue);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
#top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:none}
.brand .logo{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:22px}
.brand b{display:block;font-size:17px;line-height:1.1}.brand small{display:block;font-size:12px;opacity:.85;font-weight:700}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:flex-end}
#nav::-webkit-scrollbar{display:none}
#nav a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap}
#nav a:hover{background:rgba(255,255,255,.15)}
#nav a.on{background:#fff;color:var(--blue-d)}
@media (max-width:760px){#top .in{flex-wrap:wrap;gap:6px}#nav{justify-content:flex-start;flex-basis:100%;margin:0 -4px}}

main{max-width:1000px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.hero{padding:18px 0 6px}
.hero h1{font-size:clamp(30px,5vw,44px);color:var(--ink)}
.hero.small h1{font-size:clamp(26px,4vw,34px)}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:900;color:var(--blue-d);margin:0 0 6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .eyebrow{color:#6cc3ec}}
:root[data-theme="dark"] .eyebrow{color:#6cc3ec}
.lede{font-size:18px;color:var(--muted);max-width:62ch;margin:0}
.intro{color:var(--muted);max-width:65ch}
.note{background:var(--soft);border-radius:12px;padding:12px 16px;margin:14px 0;color:var(--ink);max-width:75ch}
.h2{margin-top:28px;font-size:22px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 20px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;text-decoration:none;cursor:pointer;transition:transform .08s,background .15s}
.btn:hover{border-color:var(--blue)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.ghost{background:transparent}
.btn.big{min-height:54px;font-size:17px;padding:12px 26px}
.btn.small{min-height:34px;padding:4px 12px;font-size:14px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0}
.actions,.row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 4px}

/* home */
.next{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:2px solid var(--blue);border-radius:18px;padding:20px 22px;margin:18px 0}
.next>div:first-child{flex:1 1 320px;min-width:0}
.next h2{font-size:22px}.next p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800;background:var(--soft);color:var(--muted);text-decoration:none}
.chip.focus{background:var(--bad-bg);color:var(--bad)}
.chip.going{background:var(--warn-bg);color:var(--warn)}
.chip.secure{background:var(--good-bg);color:var(--good)}
a.chip.focus{font-size:14px;padding:6px 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}.stat b small{font-size:16px;color:var(--muted)}
.stat span{color:var(--muted);font-size:14px}
.stat input[type=date]{margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--bg);font-size:16px;max-width:100%}
.area{margin-top:30px}
.area h2{font-size:24px;display:flex;align-items:center;gap:10px}
.area h2::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--c,var(--blue))}
.area .sub{color:var(--muted);margin:-4px 0 12px}
.tier.t1 h2::before{background:var(--good)}.tier.t2 h2::before{background:var(--warn)}.tier.t3 h2::before{background:var(--muted)}
.tmarks{font-size:14px;font-weight:800;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 10px}
.wpill{align-self:flex-start;font-size:12px;font-weight:900;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted)}
.wpill.t1{background:var(--good-bg);color:var(--good)}.wpill.t2{background:var(--warn-bg);color:var(--warn)}
.opts.yn{grid-template-columns:repeat(2,minmax(0,140px))}
.sublab{font-weight:800;font-size:15px;margin-top:12px}
.a-num{--c:var(--num)}.a-mea{--c:var(--mea)}.a-dat{--c:var(--dat)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);transition:transform .12s,box-shadow .12s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,35,46,.1)}
.tname{font-weight:900;font-size:17px;line-height:1.25}
.tshort{color:var(--muted);font-size:14px;flex:1}
.tfoot{display:flex;align-items:center;gap:10px;margin-top:6px}
.meter{flex:1;height:7px;background:var(--soft);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}
.howto{padding-left:1.3em;max-width:75ch}.howto li{margin:6px 0}

/* topic page */
.back{display:inline-block;margin:0 0 8px;font-weight:800;text-decoration:none}
.thead{border-left:6px solid var(--c);padding:4px 0 4px 16px;margin-bottom:14px}
.thead h1{font-size:clamp(26px,4vw,36px)}
.tmeta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:8px 0 18px;overflow-x:auto}
.tabs a{padding:10px 16px;font-weight:900;text-decoration:none;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--blue)}
.learn{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 24px;max-width:820px}
.learn h3{font-size:20px;margin-top:22px;color:var(--blue-d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .learn h3{color:#6cc3ec}}
:root[data-theme="dark"] .learn h3{color:#6cc3ec}
.learn p,.learn li{max-width:68ch}
.spec{background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.spec h3{margin-top:0;font-size:16px;color:var(--ink)}
.spec ul{margin:0;padding-left:1.2em}
.key{background:var(--soft);border-left:5px solid var(--blue);border-radius:8px;padding:10px 14px;margin:12px 0}
.key p{margin:4px 0}
.warn{background:var(--warn-bg);border-left:5px solid var(--warn);border-radius:8px;padding:10px 14px;margin:12px 0}
.tip{background:var(--good-bg);border-left:5px solid var(--good);border-radius:8px;padding:10px 14px;margin:12px 0}
.formula{display:block;font-weight:900;font-size:18px;background:var(--soft);padding:8px 14px;border-radius:10px;margin:10px 0;width:fit-content;max-width:100%}
.formula.inline{display:inline-block;font-size:16px;padding:2px 10px;margin:0 2px;vertical-align:middle}
ol.steps{padding-left:1.4em}ol.steps li{margin:4px 0}
.tri-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.tri{width:120px;height:104px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--blue);color:#fff;position:relative;font-weight:900;font-size:22px;flex:none}
.tri span:nth-child(1){position:absolute;top:34px;left:0;right:0;text-align:center}
.tri span:nth-child(2){position:absolute;bottom:8px;left:28px}.tri span:nth-child(3){position:absolute;bottom:8px;right:28px}
.tri::after{content:"";position:absolute;left:22%;right:22%;top:64px;height:3px;background:#fff}
.tri-wrap .formula{margin:4px 0}

/* fractions */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.1;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}

/* tables */
.tw{overflow-x:auto;max-width:100%;margin:10px 0}
table.qt{border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--card)}
table.qt th,table.qt td{border:1px solid var(--line);padding:6px 12px;text-align:center}
table.qt thead th{background:var(--soft);font-weight:900}
table.qt tbody th{text-align:left;font-weight:800;background:var(--soft)}
table.qt.small th,table.qt.small td{padding:3px 9px}
table.qt td.hit{background:var(--good-bg);color:var(--good);font-weight:900}
table.qt.res td.ok{color:var(--good);font-weight:900}table.qt.res td.no{color:var(--bad);font-weight:900}
table.qt.working{font-size:15px}
.data{font-size:19px;font-weight:800;letter-spacing:.01em;background:var(--soft);padding:8px 14px;border-radius:10px;margin:8px 0;font-variant-numeric:tabular-nums}

/* diagrams */
svg.dia{display:block;max-width:100%;height:auto;margin:10px 0;overflow:visible}
.dia text{fill:var(--ink);font:800 13px var(--font)}
.dia text.small{font-size:11px;fill:var(--muted);font-weight:700}
.dia text.bold{font-size:15px;font-weight:900}
.dia .shape{fill:var(--shape);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.dia .shape.top{fill:var(--soft)}.dia .shape.side{fill:var(--line)}
.dia .edge{stroke:var(--ink);stroke-width:2;fill:none}.dia .thin{stroke-width:1.2}
.dia .dash{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.dia .dot{fill:var(--ink)}
.dia .gl{stroke:var(--line);stroke-width:1}
.dia .gm{stroke:var(--line);stroke-width:.6;opacity:.7}
.dia .ax{stroke:var(--ink);stroke-width:1.6}
.dia .pt{fill:var(--blue);stroke:var(--card);stroke-width:1.5}
.dia .cross{stroke:var(--dat);stroke-width:2.2}
.dia .bestfit{stroke:var(--bad);stroke-width:2.2}
.dia .plot{stroke:var(--blue);stroke-width:2.6}
.dia .bar{fill:var(--blue);opacity:.85}

/* question cards */
.pbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;color:var(--muted);font-weight:800;margin-bottom:8px}
.track{flex-basis:100%;height:6px;background:var(--line);border-radius:6px;overflow:hidden}.track i{display:block;height:100%;background:var(--blue)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin:0 0 16px;max-width:820px}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px;font-size:13px}
.qnum{background:var(--ink);color:var(--card);border-radius:8px;padding:2px 9px;font-weight:900;font-size:14px}
.qtopic{font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.badge{border-radius:999px;padding:2px 10px;font-weight:900}
.badge.calc{background:var(--soft);color:var(--blue-d)}
.badge.nocalc{background:var(--warn-bg);color:var(--warn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.calc{color:#6cc3ec}}
:root[data-theme="dark"] .badge.calc{color:#6cc3ec}
.marks{margin-left:auto;color:var(--muted);font-weight:800}
.stem{font-size:17px}
.stem>p{margin:6px 0}
.part{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.pq{display:flex;gap:8px;font-size:17px;font-weight:800}
.plab{font-weight:900;color:var(--blue-d)}
.pm{color:var(--muted);font-size:13px;font-weight:700}
.ans{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pre,.suf{font-weight:900;font-size:18px}
.inp{font-size:18px;font-weight:800;padding:10px 12px;min-height:48px;width:220px;max-width:100%;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.inp.short{width:90px}
.inp:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(23,152,211,.25)}
.inp:disabled{opacity:.8}
.hintline{color:var(--muted);font-size:13px;margin-top:4px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;padding:10px 14px;min-height:46px;border:2px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;font-weight:700}
.opt:hover{border-color:var(--blue)}
.opt[aria-checked="true"]{border-color:var(--blue);background:var(--soft);box-shadow:inset 0 0 0 1px var(--blue)}
.opt:disabled{cursor:default}
.fb{margin-top:8px;border-radius:10px}
.fb:empty{display:none}
.fb.good,.fb.bad,.fb.info{padding:8px 12px}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.bad b,.fb.good b{color:inherit}
.fb.info{background:var(--soft)}
.hintbox{background:var(--warn-bg);border-radius:10px;padding:10px 14px;margin-top:12px}
.sol{margin-top:14px;background:var(--soft);border-radius:12px;padding:12px 16px}
.sol h4,.wsteps-live h4{margin:0 0 6px;font-size:16px}
.sol summary{cursor:pointer;font-weight:900;color:var(--blue-d)}
.wsteps{margin:0;padding-left:1.4em}.wsteps li{margin:6px 0}
.final{margin:10px 0 0;font-size:17px}.final span{font-weight:900}
.wsteps-live{margin-top:14px;background:var(--soft);border-radius:12px;padding:12px 16px}
.wsteps-live .wsteps:empty{display:none}

/* results and mock */
.result h1 small{color:var(--muted);font-size:.6em}
.result .big{font-size:22px;font-weight:900}
.mockinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:16px 0}
.mockinfo .sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.mockinfo p{color:var(--muted);margin:0 0 10px}
.mockinfo input{width:80px;padding:6px 8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.timerbar{position:sticky;top:58px;z-index:10;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;margin-bottom:16px}
@media (max-width:760px){.timerbar{top:96px}}
.clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:18px}
.clock.low{color:var(--focus)}
.work{margin-top:12px}.work summary{cursor:pointer;color:var(--muted);font-weight:800}
.work textarea{width:100%;min-height:110px;margin-top:6px;border:2px dashed var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:16px}
.finishbox{max-width:820px}
.confirm{background:var(--card);border:2px solid var(--blue);border-radius:14px;padding:14px 18px}
.sechead{margin:24px 0 10px;font-size:20px}
details.review summary{cursor:pointer;font-weight:900;display:flex;align-items:center;gap:10px}
details.review summary .rs{margin-left:auto}
details.review.right{border-left:6px solid var(--good)}details.review.wrong{border-left:6px solid var(--bad)}
details.review[open] summary{margin-bottom:10px}
.mywork pre{white-space:pre-wrap;font:inherit;background:var(--bg);padding:8px 12px;border-radius:8px}

/* worksheets */
.sheetform fieldset{border:1px solid var(--line);border-radius:14px;padding:10px 16px 12px;margin:0 0 12px;background:var(--card);display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 16px}
.sheetform legend{font-weight:900;padding:0 6px}
.tk{display:flex;align-items:center;gap:8px;min-height:36px}
.tk input,.sheetform legend input{width:20px;height:20px;accent-color:var(--blue)}
.opts-row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin:8px 0}
.opts-row select{margin-left:6px;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--card);font-size:16px}
.preview{background:#fff;color:#14232e;border:1px solid var(--line);border-radius:6px;padding:28px 32px;margin-top:12px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.preview .dia text{fill:#14232e}
.sheethead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--blue);padding-bottom:10px;margin-bottom:14px}
.sheethead h1{font-size:22px;margin:0}
.sheetsub{color:#5a6b78;margin:2px 0 0;font-size:14px}
.namebox{line-height:2;font-size:14px}
.pq-print{border-bottom:1px solid #d9e5ee;padding:10px 0 14px;break-inside:avoid}
.qno{font-weight:900;margin:0 0 4px}.qno span{font-weight:700;color:#5a6b78;font-size:13px;margin-left:8px}
.ppart{font-weight:800;margin:8px 0 0}
.choicelist{margin:8px 0 0;padding-left:1.2em;list-style:upper-alpha}.choicelist li{margin:3px 0}
.workspace{height:110px;border:1px dashed #c9d6e0;border-radius:8px;margin:10px 0 6px}
.ansline{margin:6px 0 0;font-weight:800}
.answers{break-before:page;margin-top:30px}
.answers h2{border-bottom:3px solid var(--blue);padding-bottom:6px}
.ansitem{break-inside:avoid;margin-bottom:10px}
.sheetfoot{color:#5a6b78;font-size:12px;margin-top:20px}

/* footer */
#foot{border-top:1px solid var(--line);color:var(--muted);font-size:14px}
#foot .in{max-width:1000px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
#foot .ver{margin-left:auto;font-weight:800}
#resetbox:empty{display:none}
#resetbox{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
#printRoot{display:none}

@media (max-width:560px){
  .qcard{padding:14px 14px}.learn{padding:16px}
  .preview{padding:16px}
  .marks{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* print */
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#000;font-size:12.5pt}
  body.printing>*:not(#printRoot){display:none!important}
  body.printing #printRoot{display:block}
  body:not(.printing) #top,body:not(.printing) #foot,body:not(.printing) .actions,body:not(.printing) .tabs{display:none}
  .preview{border:0;box-shadow:none;padding:0}
  .dia text{fill:#000}
  .key,.warn,.tip,.spec,.formula,.data,.sol{background:none!important;border-color:#999}
  .sheet h1{font-size:20pt}
  .workspace{height:30mm}
  a{color:#000;text-decoration:none}
}
