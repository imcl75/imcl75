<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Functional Maths L2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: WFA shell (blue top bar, Nunito), one centred column of cards; topic areas colour-coded */
:root{
  --blue:#1798d3; --blue-d:#0f6e9c; --soft:#eef6fb;
  --bg:#f6f9fb; --card:#ffffff; --ink:#14232e; --muted:#5a6b78; --line:#d9e5ee; --shape:#e3f1fa;
  --num:#1798d3; --mea:#0f9a83; --dat:#7a5ad6;
  --good:#1f8f4e; --good-bg:#e7f6ee; --bad:#c43d3d; --bad-bg:#fbeaea; --warn:#b8770b; --warn-bg:#fdf3e1;
  --focus:#ffbf47;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a22; --card:#16242f; --ink:#e7f0f6; --muted:#9db0be; --line:#2a3c4a; --shape:#1c3444; --soft:#173041;
  --good:#5fcf8e; --good-bg:#15301f; --bad:#ff8a8a; --bad-bg:#3a1c1e; --warn:#f0b45a; --warn-bg:#352813; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a22; --card:#16242f; --ink:#e7f0f6; --muted:#9db0be; --line:#2a3c4a; --shape:#1c3444; --soft:#173041;
  --good:#5fcf8e; --good-bg:#15301f; --bad:#ff8a8a; --bad-bg:#3a1c1e; --warn:#f0b45a; --warn-bg:#352813; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.55 var(--font)}
a{color:var(--blue-d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) a{color:#6cc3ec}}
:root[data-theme="dark"] a{color:#6cc3ec}
h1,h2,h3,h4{font-weight:900;line-height:1.2;text-wrap:balance;margin:0 0 .4em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* top bar */
#top{background:var(--blue);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
#top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:none}
.brand .logo{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:22px}
.brand b{display:block;font-size:17px;line-height:1.1}.brand small{display:block;font-size:12px;opacity:.85;font-weight:700}
#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:flex-end}
#nav::-webkit-scrollbar{display:none}
#nav a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap}
#nav a:hover{background:rgba(255,255,255,.15)}
#nav a.on{background:#fff;color:var(--blue-d)}
@media (max-width:760px){#top .in{flex-wrap:wrap;gap:6px}#nav{justify-content:flex-start;flex-basis:100%;margin:0 -4px}}

main{max-width:1000px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.hero{padding:18px 0 6px}
.hero h1{font-size:clamp(30px,5vw,44px);color:var(--ink)}
.hero.small h1{font-size:clamp(26px,4vw,34px)}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:900;color:var(--blue-d);margin:0 0 6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .eyebrow{color:#6cc3ec}}
:root[data-theme="dark"] .eyebrow{color:#6cc3ec}
.lede{font-size:18px;color:var(--muted);max-width:62ch;margin:0}
.intro{color:var(--muted);max-width:65ch}
.note{background:var(--soft);border-radius:12px;padding:12px 16px;margin:14px 0;color:var(--ink);max-width:75ch}
.h2{margin-top:28px;font-size:22px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 20px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;text-decoration:none;cursor:pointer;transition:transform .08s,background .15s}
.btn:hover{border-color:var(--blue)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.ghost{background:transparent}
.btn.big{min-height:54px;font-size:17px;padding:12px 26px}
.btn.small{min-height:34px;padding:4px 12px;font-size:14px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0}
.actions,.row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 4px}

/* home */
.next{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:2px solid var(--blue);border-radius:18px;padding:20px 22px;margin:18px 0}
.next>div:first-child{flex:1 1 320px;min-width:0}
.next h2{font-size:22px}.next p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800;background:var(--soft);color:var(--muted);text-decoration:none}
.chip.focus{background:var(--bad-bg);color:var(--bad)}
.chip.going{background:var(--warn-bg);color:var(--warn)}
.chip.secure{background:var(--good-bg);color:var(--good)}
a.chip.focus{font-size:14px;padding:6px 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}.stat b small{font-size:16px;color:var(--muted)}
.stat span{color:var(--muted);font-size:14px}
.stat input[type=date]{margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--bg);font-size:16px;max-width:100%}
.area{margin-top:30px}
.area h2{font-size:24px;display:flex;align-items:center;gap:10px}
.area h2::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--c,var(--blue))}
.area .sub{color:var(--muted);margin:-4px 0 12px}
.tier.t1 h2::before{background:var(--good)}.tier.t2 h2::before{background:var(--warn)}.tier.t3 h2::before{background:var(--muted)}
.tmarks{font-size:14px;font-weight:800;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 10px}
.wpill{align-self:flex-start;font-size:12px;font-weight:900;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted)}
.wpill.t1{background:var(--good-bg);color:var(--good)}.wpill.t2{background:var(--warn-bg);color:var(--warn)}
.opts.yn{grid-template-columns:repeat(2,minmax(0,140px))}
.sublab{font-weight:800;font-size:15px;margin-top:12px}
.a-num{--c:var(--num)}.a-mea{--c:var(--mea)}.a-dat{--c:var(--dat)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);transition:transform .12s,box-shadow .12s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,35,46,.1)}
.tname{font-weight:900;font-size:17px;line-height:1.25}
.tshort{color:var(--muted);font-size:14px;flex:1}
.tfoot{display:flex;align-items:center;gap:10px;margin-top:6px}
.meter{flex:1;height:7px;background:var(--soft);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}
.howto{padding-left:1.3em;max-width:75ch}.howto li{margin:6px 0}

/* topic page */
.back{display:inline-block;margin:0 0 8px;font-weight:800;text-decoration:none}
.thead{border-left:6px solid var(--c);padding:4px 0 4px 16px;margin-bottom:14px}
.thead h1{font-size:clamp(26px,4vw,36px)}
.tmeta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:8px 0 18px;overflow-x:auto}
.tabs a{padding:10px 16px;font-weight:900;text-decoration:none;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--blue)}
.learn{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 24px;max-width:820px}
.learn h3{font-size:20px;margin-top:22px;color:var(--blue-d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .learn h3{color:#6cc3ec}}
:root[data-theme="dark"] .learn h3{color:#6cc3ec}
.learn p,.learn li{max-width:68ch}
.spec{background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.spec h3{margin-top:0;font-size:16px;color:var(--ink)}
.spec ul{margin:0;padding-left:1.2em}
.key{background:var(--soft);border-left:5px solid var(--blue);border-radius:8px;padding:10px 14px;margin:12px 0}
.key p{margin:4px 0}
.warn{background:var(--warn-bg);border-left:5px solid var(--warn);border-radius:8px;padding:10px 14px;margin:12px 0}
.tip{background:var(--good-bg);border-left:5px solid var(--good);border-radius:8px;padding:10px 14px;margin:12px 0}
.formula{display:block;font-weight:900;font-size:18px;background:var(--soft);padding:8px 14px;border-radius:10px;margin:10px 0;width:fit-content;max-width:100%}
.formula.inline{display:inline-block;font-size:16px;padding:2px 10px;margin:0 2px;vertical-align:middle}
ol.steps{padding-left:1.4em}ol.steps li{margin:4px 0}
.tri-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.tri{width:120px;height:104px;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--blue);color:#fff;position:relative;font-weight:900;font-size:22px;flex:none}
.tri span:nth-child(1){position:absolute;top:34px;left:0;right:0;text-align:center}
.tri span:nth-child(2){position:absolute;bottom:8px;left:28px}.tri span:nth-child(3){position:absolute;bottom:8px;right:28px}
.tri::after{content:"";position:absolute;left:22%;right:22%;top:64px;height:3px;background:#fff}
.tri-wrap .formula{margin:4px 0}

/* fractions */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.1;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}

/* tables */
.tw{overflow-x:auto;max-width:100%;margin:10px 0}
table.qt{border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--card)}
table.qt th,table.qt td{border:1px solid var(--line);padding:6px 12px;text-align:center}
table.qt thead th{background:var(--soft);font-weight:900}
table.qt tbody th{text-align:left;font-weight:800;background:var(--soft)}
table.qt.small th,table.qt.small td{padding:3px 9px}
table.qt td.hit{background:var(--good-bg);color:var(--good);font-weight:900}
table.qt.res td.ok{color:var(--good);font-weight:900}table.qt.res td.no{color:var(--bad);font-weight:900}
table.qt.working{font-size:15px}
.data{font-size:19px;font-weight:800;letter-spacing:.01em;background:var(--soft);padding:8px 14px;border-radius:10px;margin:8px 0;font-variant-numeric:tabular-nums}

/* diagrams */
svg.dia{display:block;max-width:100%;height:auto;margin:10px 0;overflow:visible}
.dia text{fill:var(--ink);font:800 13px var(--font)}
.dia text.small{font-size:11px;fill:var(--muted);font-weight:700}
.dia text.bold{font-size:15px;font-weight:900}
.dia .shape{fill:var(--shape);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.dia .shape.top{fill:var(--soft)}.dia .shape.side{fill:var(--line)}
.dia .edge{stroke:var(--ink);stroke-width:2;fill:none}.dia .thin{stroke-width:1.2}
.dia .dash{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.dia .dot{fill:var(--ink)}
.dia .gl{stroke:var(--line);stroke-width:1}
.dia .gm{stroke:var(--line);stroke-width:.6;opacity:.7}
.dia .ax{stroke:var(--ink);stroke-width:1.6}
.dia .pt{fill:var(--blue);stroke:var(--card);stroke-width:1.5}
.dia .cross{stroke:var(--dat);stroke-width:2.2}
.dia .bestfit{stroke:var(--bad);stroke-width:2.2}
.dia .plot{stroke:var(--blue);stroke-width:2.6}
.dia .bar{fill:var(--blue);opacity:.85}

/* question cards */
.pbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;color:var(--muted);font-weight:800;margin-bottom:8px}
.track{flex-basis:100%;height:6px;background:var(--line);border-radius:6px;overflow:hidden}.track i{display:block;height:100%;background:var(--blue)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin:0 0 16px;max-width:820px}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px;font-size:13px}
.qnum{background:var(--ink);color:var(--card);border-radius:8px;padding:2px 9px;font-weight:900;font-size:14px}
.qtopic{font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.badge{border-radius:999px;padding:2px 10px;font-weight:900}
.badge.calc{background:var(--soft);color:var(--blue-d)}
.badge.nocalc{background:var(--warn-bg);color:var(--warn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.calc{color:#6cc3ec}}
:root[data-theme="dark"] .badge.calc{color:#6cc3ec}
.marks{margin-left:auto;color:var(--muted);font-weight:800}
.stem{font-size:17px}
.stem>p{margin:6px 0}
.part{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.pq{display:flex;gap:8px;font-size:17px;font-weight:800}
.plab{font-weight:900;color:var(--blue-d)}
.pm{color:var(--muted);font-size:13px;font-weight:700}
.ans{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pre,.suf{font-weight:900;font-size:18px}
.inp{font-size:18px;font-weight:800;padding:10px 12px;min-height:48px;width:220px;max-width:100%;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.inp.short{width:90px}
.inp:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(23,152,211,.25)}
.inp:disabled{opacity:.8}
.hintline{color:var(--muted);font-size:13px;margin-top:4px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;padding:10px 14px;min-height:46px;border:2px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;font-weight:700}
.opt:hover{border-color:var(--blue)}
.opt[aria-checked="true"]{border-color:var(--blue);background:var(--soft);box-shadow:inset 0 0 0 1px var(--blue)}
.opt:disabled{cursor:default}
.fb{margin-top:8px;border-radius:10px}
.fb:empty{display:none}
.fb.good,.fb.bad,.fb.info{padding:8px 12px}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.bad b,.fb.good b{color:inherit}
.fb.info{background:var(--soft)}
.hintbox{background:var(--warn-bg);border-radius:10px;padding:10px 14px;margin-top:12px}
.sol{margin-top:14px;background:var(--soft);border-radius:12px;padding:12px 16px}
.sol h4,.wsteps-live h4{margin:0 0 6px;font-size:16px}
.sol summary{cursor:pointer;font-weight:900;color:var(--blue-d)}
.wsteps{margin:0;padding-left:1.4em}.wsteps li{margin:6px 0}
.final{margin:10px 0 0;font-size:17px}.final span{font-weight:900}
.wsteps-live{margin-top:14px;background:var(--soft);border-radius:12px;padding:12px 16px}
.wsteps-live .wsteps:empty{display:none}

/* results and mock */
.result h1 small{color:var(--muted);font-size:.6em}
.result .big{font-size:22px;font-weight:900}
.mockinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:16px 0}
.mockinfo .sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.mockinfo p{color:var(--muted);margin:0 0 10px}
.mockinfo input{width:80px;padding:6px 8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.timerbar{position:sticky;top:58px;z-index:10;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;margin-bottom:16px}
@media (max-width:760px){.timerbar{top:96px}}
.clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:18px}
.clock.low{color:var(--focus)}
.work{margin-top:12px}.work summary{cursor:pointer;color:var(--muted);font-weight:800}
.work textarea{width:100%;min-height:110px;margin-top:6px;border:2px dashed var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:16px}
.finishbox{max-width:820px}
.confirm{background:var(--card);border:2px solid var(--blue);border-radius:14px;padding:14px 18px}
.sechead{margin:24px 0 10px;font-size:20px}
details.review summary{cursor:pointer;font-weight:900;display:flex;align-items:center;gap:10px}
details.review summary .rs{margin-left:auto}
details.review.right{border-left:6px solid var(--good)}details.review.wrong{border-left:6px solid var(--bad)}
details.review[open] summary{margin-bottom:10px}
.mywork pre{white-space:pre-wrap;font:inherit;background:var(--bg);padding:8px 12px;border-radius:8px}

/* worksheets */
.sheetform fieldset{border:1px solid var(--line);border-radius:14px;padding:10px 16px 12px;margin:0 0 12px;background:var(--card);display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 16px}
.sheetform legend{font-weight:900;padding:0 6px}
.tk{display:flex;align-items:center;gap:8px;min-height:36px}
.tk input,.sheetform legend input{width:20px;height:20px;accent-color:var(--blue)}
.opts-row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin:8px 0}
.opts-row select{margin-left:6px;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--card);font-size:16px}
.preview{background:#fff;color:#14232e;border:1px solid var(--line);border-radius:6px;padding:28px 32px;margin-top:12px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.preview .dia text{fill:#14232e}
.sheethead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--blue);padding-bottom:10px;margin-bottom:14px}
.sheethead h1{font-size:22px;margin:0}
.sheetsub{color:#5a6b78;margin:2px 0 0;font-size:14px}
.namebox{line-height:2;font-size:14px}
.pq-print{border-bottom:1px solid #d9e5ee;padding:10px 0 14px;break-inside:avoid}
.qno{font-weight:900;margin:0 0 4px}.qno span{font-weight:700;color:#5a6b78;font-size:13px;margin-left:8px}
.ppart{font-weight:800;margin:8px 0 0}
.choicelist{margin:8px 0 0;padding-left:1.2em;list-style:upper-alpha}.choicelist li{margin:3px 0}
.workspace{height:110px;border:1px dashed #c9d6e0;border-radius:8px;margin:10px 0 6px}
.ansline{margin:6px 0 0;font-weight:800}
.answers{break-before:page;margin-top:30px}
.answers h2{border-bottom:3px solid var(--blue);padding-bottom:6px}
.ansitem{break-inside:avoid;margin-bottom:10px}
.sheetfoot{color:#5a6b78;font-size:12px;margin-top:20px}

/* footer */
#foot{border-top:1px solid var(--line);color:var(--muted);font-size:14px}
#foot .in{max-width:1000px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
#foot .ver{margin-left:auto;font-weight:800}
#resetbox:empty{display:none}
#resetbox{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
#printRoot{display:none}

@media (max-width:560px){

<div id="printRoot"></div>
<script>
'use strict';
/* =====================================================================
   core.js: random helpers, number formatting, answer checking, diagrams
   ===================================================================== */

const TOPICS = [];
const AREAS = [
  { id: 'num', name: 'Number', blurb: 'Whole numbers, fractions, decimals, percentages, ratio and formulae' },
  { id: 'mea', name: 'Measures, shape and space', blurb: 'Money, units, time, area, volume, scale and angles' },
  { id: 'dat', name: 'Handling data', blurb: 'Averages, probability, tables, charts and scatter graphs' }
];
function addTopic(t) { TOPICS.push(t); }
function topicById(id) { return TOPICS.find(t => t.id === id); }

/* ---------- exam weighting ----------
   Average marks per 60-mark TQUK Level 2 paper, from 5 papers (2 sample, 3 past),
   counted part by part. SEC_A_W is the share of those marks in Section A (no calculator). */
const EXAM_W = { 'n-pct': 7.4, 'm-area': 5.6, 'n-ratio': 5.6, 'n-calc': 5.6, 'n-fdp': 5.2, 'd-avg': 5.2,
  'm-money': 3.6, 'm-compound': 3.0, 'm-shape': 2.8, 'm-volume': 2.6, 'n-formula': 2.4,
  'd-grouped': 2.2, 'm-convert': 2.2, 'n-num': 2.2, 'd-prob': 1.8, 'm-scale': 1.2, 'n-est': 1.2, 'm-time': 0.2, 'd-charts': 0 };
const SEC_A_W = { 'n-calc': 3.4, 'n-fdp': 3.0, 'm-compound': 2.0, 'n-pct': 1.2, 'd-prob': 1.2 };
const TIERS = [
  { k: 1, name: 'Start here', marks: 'about 35 of the 60 marks', blurb: 'These six come up in every TQUK paper. Together they are worth about the pass mark.' },
  { k: 2, name: 'Next', marks: 'about 14 marks', blurb: 'Usually one question each, often inside a longer problem.' },
  { k: 3, name: 'Leave until last', marks: '2 marks or fewer each', blurb: 'Worth learning once the topics above are secure.' }
];
function examW(id) { return EXAM_W[id] || 0; }
function tierOf(id) { const w = examW(id); return w >= 5 ? 1 : w >= 2.4 ? 2 : 3; }
function byWeight(list) { const k = Object.keys(EXAM_W); return (list || TOPICS).slice().sort((a, b) => examW(b.id) - examW(a.id) || k.indexOf(a.id) - k.indexOf(b.id)); }
function marksLabel(id) { const w = examW(id); if (w >= 1) { const n = Math.round(w); return `≈${n} mark${n === 1 ? '' : 's'} a paper`; } return w > 0 ? 'Rarely tested' : 'Not on TQUK papers so far'; }

/* ---------- random ---------- */
const NAMES = ['Sam', 'Priya', 'Tom', 'Aisha', 'Jordan', 'Megan', 'Ravi', 'Chloe', 'Dan', 'Zara', 'Ben', 'Leah',
  'Kofi', 'Hannah', 'Marek', 'Ellie', 'Omar', 'Grace', 'Josh', 'Nadia', 'Callum', 'Freya', 'Imran', 'Rosie'];
const R = {
  int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: a => a[Math.floor(Math.random() * a.length)],
  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  step: (a, b, s) => rd(a + s * R.int(0, Math.floor((b - a) / s + 1e-9)), 6),
  coin: () => Math.random() < 0.5,
  name: () => R.pick(NAMES),
  names: n => R.shuffle(NAMES).slice(0, n)
};

/* ---------- numbers ---------- */
function rd(x, dp = 2) { const f = Math.pow(10, dp); return Math.round(x * f + (x >= 0 ? 1e-7 : -1e-7)) / f; }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
function lcm(a, b) { return a / gcd(a, b) * b; }
function simp(n, d) { const g = gcd(n, d) || 1; return [n / g, d / g]; }
function sf(x, n) { return Number(Number(x).toPrecision(n)); }
/* number with thousands commas; dp = fixed decimal places (optional) */
function fmt(x, dp) {
  const neg = x < 0; x = Math.abs(x);
  const s = dp === undefined
    ? rd(x, 6).toLocaleString('en-GB', { maximumFractionDigits: 6 })
    : rd(x, dp).toLocaleString('en-GB', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  return (neg ? '−' : '') + s;
}
const sn = fmt; // signed display (uses a true minus sign)
function gbp(x) { return (x < 0 ? '−' : '') + '£' + fmt(rd(Math.abs(x), 2), 2); }
function money(x) { return Math.abs(x) < 1 && x !== 0 ? Math.round(Math.abs(x) * 100) + 'p' : gbp(x); }
/* fractions */
function F(n, d) { return `<span class="fr"><span>${n}</span><span>${d}</span></span>`; }
function M(n, d) { // improper n/d -> mixed number HTML
  const [a, b] = simp(n, d);
  if (b === 1) return String(a);
  const w = Math.floor(a / b), r = a % b;
  return w ? `${w}&nbsp;${F(r, b)}` : F(r, b);
}
function fracText(n, d) { const [a, b] = simp(n, d); if (b === 1) return String(a); const w = Math.floor(a / b), r = a % b; return w ? `${w} ${r}/${b}` : `${r}/${b}`; }
function hhmm(m) { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function hm(m) { const h = Math.floor(m / 60), mi = m % 60; return (h ? h + (h === 1 ? ' hour' : ' hours') : '') + (h && mi ? ' ' : '') + (mi || !h ? mi + ' minutes' : ''); }
function twelve(m) { const h = Math.floor(m / 60) % 24, mi = m % 60; const ap = h >= 12 ? 'pm' : 'am'; const h12 = h % 12 === 0 ? 12 : h % 12; return `${h12}:${String(mi).padStart(2, '0')} ${ap}`; }
function an(x) { return /^(8|11|18|[aeiou])/i.test(String(x)) ? 'an' : 'a'; }
function An(x) { return an(x) === 'an' ? 'An' : 'A'; }
function ord(n) { const s = n % 100; if (s >= 11 && s <= 13) return n + 'th'; return n + ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'); }
function pl(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
function bearing(b) { return String(b).padStart(3, '0') + '°'; }

function words(n) {
  const ones = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  const u100 = x => x < 20 ? ones[x] : tens[Math.floor(x / 10)] + (x % 10 ? '-' + ones[x % 10] : '');
  const u1000 = x => { const h = Math.floor(x / 100), r = x % 100; let s = ''; if (h) s = ones[h] + ' hundred'; if (r) s += (h ? ' and ' : '') + u100(r); return s; };
  const m = Math.floor(n / 1e6), th = Math.floor(n / 1000) % 1000, u = n % 1000, out = [];
  if (m) out.push(u1000(m) + ' million');
  if (th) out.push(u1000(th) + ' thousand');
  if (u) out.push((u < 100 && (m || th) ? 'and ' : '') + u1000(u));
  return out.join(', ').replace(/, and /g, ' and ');
}

/* ---------- answer checking ---------- */
function clean(s) {
  let t = String(s == null ? '' : s).trim().toLowerCase().replace(/[−–—]/g, '-').replace(/,/g, '').replace(/\u00a0/g, ' ');
  t = t.replace(/(\d)\s*¼/g, '$1 1/4').replace(/(\d)\s*½/g, '$1 1/2').replace(/(\d)\s*¾/g, '$1 3/4').replace(/¼/g, '1/4').replace(/½/g, '1/2').replace(/¾/g, '3/4');
  t = t.replace(/^\((.*)\)$/, '$1').replace(/^-\s+/, '-').replace(/(\d)\s+and\s+(\d+\s*\/)/, '$1 $2').replace(/^(\d+)-(\d+\s*\/\s*\d+)$/, '$1 $2');
  if (/^-?\d{1,3}( \d{3})+(\.\d+)?$/.test(t)) t = t.replace(/ /g, '');
  return t;
}
function parseVal(s) {
  let t = clean(s); if (!t) return null;
  t = t.replace(/^[a-z]\s*=\s*/, '');
  let pct = false, pence = false;
  const hadPound = /£/.test(t);
  t = t.replace(/[£€$]/g, '').trim().replace(/^-\s+/, '-');
  if (/%\s*$/.test(t)) { pct = true; t = t.replace(/%\s*$/, '').trim(); }
  if (/^-?[\d.]+\s*p$/.test(t)) { pence = !hadPound; t = t.replace(/\s*p$/, ''); }
  t = t.replace(/\s*[a-z°][a-z°²³\/.\s\d]*$/, '').trim();
  let m;
  if ((m = t.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/))) {
    const sg = m[1] ? -1 : 1, w = +m[2], n = +m[3], d = +m[4]; if (!d) return null;
    return { v: sg * (w + n / d), kind: 'mixed', n: sg * (w * d + n), d, pct, pence };
  }
  if ((m = t.match(/^(-?\d+)\s*\/\s*(\d+)$/))) { const n = +m[1], d = +m[2]; if (!d) return null; return { v: n / d, kind: 'frac', n, d, pct, pence }; }
  if (/^[-+]?(\d+\.?\d*|\.\d+)$/.test(t)) return { v: parseFloat(t), kind: 'dec', pct, pence };
  return null;
}
function parseTime(s) {
  let t = clean(s).replace(/\s/g, '').replace(/a\.m\.?/, 'am').replace(/p\.m\.?/, 'pm').replace(/\./g, ':');
  const pm = /pm$/.test(t), am = /am$/.test(t);
  t = t.replace(/(am|pm)$/, '');
  let h, mi, mm;
  if ((mm = t.match(/^(\d{1,2}):(\d{2})$/))) { h = +mm[1]; mi = +mm[2]; }
  else if ((mm = t.match(/^(\d{3,4})$/))) { h = Math.floor(+mm[1] / 100); mi = +mm[1] % 100; }
  else if ((mm = t.match(/^(\d{1,2})$/)) && (am || pm)) { h = +mm[1]; mi = 0; }
  else return null;
  if (mi > 59 || h > 23) return null;
  if (pm && h > 12) return { m: h * 60 + mi, ampm: false };
  if ((am || pm) && (h > 12 || h === 0)) return null;
  if (pm && h < 12) h += 12;
  if (am && h === 12) h = 0;
  return { m: h * 60 + mi, ampm: am || pm };
}
function normText(s) { return clean(s).replace(/\s+/g, '').replace(/\.$/, ''); }

function checkPart(p, raw) {
  const blank = raw == null || String(raw).replace(/[|~]/g, '').trim() === '';
  if (blank) return { ok: false, blank: true };
  switch (p.type) {
    case 'choice': return { ok: +raw === p.ans };
    case 'num': {
      const r = parseVal(raw); if (!r) return { ok: false, msg: 'That doesn’t look like a number.' };
      let v = r.v; if (r.pence && p.money) v /= 100;
      const tol = p.tol != null ? p.tol : (p.money ? 0.005 : 1e-6);
      return { ok: Math.abs(v - p.ans) <= tol + 1e-9 };
    }
    case 'frac': {
      const r = parseVal(raw); if (!r) return { ok: false, msg: 'Type a fraction like 3/4, or a mixed number like 2 1/4.' };
      const ok = Math.abs(r.v - p.ans[0] / p.ans[1]) < 1e-9;
      if (ok && p.simplest) {
        if (r.kind === 'dec') return { ok: false, msg: 'Right value, but give it as a fraction.' };
        if (gcd(r.n, r.d) !== 1) return { ok: false, msg: 'Right value, but simplify the fraction fully.' };
      }
      return { ok };
    }
    case 'prob': {
      const r = parseVal(raw); if (!r) return { ok: false, msg: 'Type a fraction, decimal or percentage.' };
      let v = r.v; if (r.pct) v /= 100;
      if (v > 1 || v < 0) return { ok: false, msg: 'A probability is always between 0 and 1.' };
      return { ok: Math.abs(v - p.ans) <= (r.kind === 'dec' ? 0.0051 : 1e-9) };
    }
    case 'ratio': {
      const parts = clean(raw).split(/\s*:\s*/).map(Number);
      if (parts.some(isNaN)) return { ok: false, msg: 'Type a ratio like 2:3.' };
      const ok = parts.length === p.ans.length && parts.every((x, i) => x === p.ans[i]);
      if (!ok && parts.length === p.ans.length && parts.every(x => x > 0) && parts.every((x, i) => Math.abs(x / parts[0] - p.ans[i] / p.ans[0]) < 1e-9))
        return { ok: false, msg: 'Equivalent, but not in its simplest form.' };
      return { ok };
    }
    case 'time': {
      const t = parseTime(raw); if (!t) return { ok: false, msg: 'Type a time like 14:35.' };
      if (p.need12 && !t.ampm) return { ok: false, msg: 'Include am or pm for the 12-hour clock.' };
      if (p.need24 && t.ampm) return { ok: false, msg: 'Use the 24-hour clock, with no am or pm.' };
      if (!p.need12 && !t.ampm && t.m !== p.ans && t.m + 720 === p.ans) return { ok: false, msg: 'Use the 24-hour clock for afternoon times (for example 14:35), or add pm.' };
      return { ok: t.m === p.ans };
    }
    case 'hm': {
      const [h, mi] = String(raw).split('|').map(x => x.trim() === '' ? 0 : Number(x));
      if (isNaN(h) || isNaN(mi)) return { ok: false, msg: 'Type whole numbers of hours and minutes.' };
      return { ok: h * 60 + mi === p.ans };
    }
    case 'coord': {
      const m = String(raw).replace(/[−–—]/g, '-').replace(/[()\s]/g, '').split(/[,;]/).map(Number);
      if (m.length !== 2 || m.some(isNaN)) return { ok: false, msg: 'Type coordinates like (3, -2).' };
      return { ok: m[0] === p.ans[0] && m[1] === p.ans[1] };
    }
    case 'text': { const n = normText(raw); return { ok: p.accept.some(a => normText(a) === n) }; }
    case 'decide': {
      const [c, ...vals] = String(raw).split('~'), m = partMarks(p);
      const cOk = c !== '' && +c === p.ans, subs = p.subs.map((s, i) => checkPart(s, vals[i])), nOk = subs.every(r => r.ok);
      const fmtMsg = subs.find(r => !r.ok && r.msg && /^(Right value|Include|Use the 24|Equivalent)/.test(r.msg));
      if (fmtMsg) return { ok: false, msg: fmtMsg.msg, got: 0 };
      if (cOk && nOk) return { ok: true };
      if (nOk) return c === '' ? { ok: false, got: m - 1, msg: 'Include your decision too: choose Yes or No.' } : { ok: false, got: m - 1, msg: 'Your number is right, but the decision doesn’t match it.' };
      if (cOk) return { ok: false, got: 0, msg: 'Right decision, but the number that proves it is wrong. In the exam, a yes or no with no correct number to back it up gets no marks.' };
      const other = subs.find(r => r.msg); return { ok: false, got: 0, msg: other ? other.msg : '' };
    }
  }
  return { ok: false };
}

function showAns(p) {
  if (p.show) return p.show;
  switch (p.type) {
    case 'num': return p.money ? gbp(p.ans) : (p.pre || '') + fmt(p.ans, p.dp) + (p.suf ? (/^[%°]/.test(p.suf) ? '' : ' ') + p.suf : '');
    case 'frac': return M(p.ans[0], p.ans[1]);
    case 'prob': return String(p.ans);
    case 'choice': return p.options[p.ans];
    case 'ratio': return p.ans.join(' : ');
    case 'time': return p.need12 ? twelve(p.ans) : hhmm(p.ans);
    case 'hm': return hm(p.ans);
    case 'coord': return `(${sn(p.ans[0])}, ${sn(p.ans[1])})`;
    case 'text': return p.accept[0];
    case 'decide': return `${p.options[p.ans]}. ${p.subs.map(s => (s.label ? s.label + ': ' : '') + showAns(s)).join(', ')}`;
  }
  return '';
}
function partMarks(p) { return p.m || 1; }
/* a decision ("Is X correct?") that only scores fully with the number that proves it */
function decide(q, yes, subs, m) { return { q, type: 'decide', options: ['Yes', 'No'], ans: yes ? 0 : 1, subs, m: m || 3 }; }
function qMarks(q) { return q.parts.reduce((s, p) => s + partMarks(p), 0); }

/* make a question from a topic. calc: true = calculator question, false = non-calculator, undefined = either */
function makeQ(topic, calc, opts = {}) {
  let gens = topic.gens.filter(g => calc === undefined || g.c === calc);
  if (opts.exam) { const ex = gens.filter(g => g.x); if (ex.length) gens = ex; }
  if (!gens.length) return null;
  const g = R.pick(gens);
  const q = g.f();
  q.topic = topic.id; q.calc = g.c;
  q.parts.forEach(p => { if (p.type === 'choice' && p.shuffle !== false) shuffleChoice(p); });
  return q;
}
function shuffleChoice(p) {
  const idx = R.shuffle(p.options.map((_, i) => i));
  p.options = idx.map(i => p.options[i]);
  p.ans = idx.indexOf(p.ans);
}

/* ---------- diagrams (SVG) ---------- */
const S = {
  wrap: (w, h, inner, label = 'Diagram') => `<svg class="dia" viewBox="0 0 ${rd(w, 1)} ${rd(h, 1)}" width="${rd(w, 1)}" role="img" aria-label="${label}">${inner}</svg>`,
  t: (x, y, s, a = 'middle', c = '') => `<text x="${rd(x, 1)}" y="${rd(y, 1)}" text-anchor="${a}"${c ? ` class="${c}"` : ''}>${s}</text>`,
  line: (x1, y1, x2, y2, c = 'edge') => `<line x1="${rd(x1, 1)}" y1="${rd(y1, 1)}" x2="${rd(x2, 1)}" y2="${rd(y2, 1)}" class="${c}"/>`,
  poly: (pts, c = 'shape') => `<polygon points="${pts.map(p => rd(p[0], 1) + ',' + rd(p[1], 1)).join(' ')}" class="${c}"/>`,
  note: '<text x="4" y="12" class="small">Not drawn accurately</text>'
};
function dRect(l, w, u) {
  const s = Math.min(240 / l, 150 / w), ox = 60, oy = 24, W = l * s, H = w * s;
  return S.wrap(ox + W + 30, oy + H + 30, S.poly([[ox, oy], [ox + W, oy], [ox + W, oy + H], [ox, oy + H]]) +
    S.t(ox + W / 2, oy + H + 20, `${fmt(l)} ${u}`) + S.t(ox - 8, oy + H / 2 + 4, `${fmt(w)} ${u}`, 'end'), 'rectangle');
}
function dLshape(W, H, a, b, u) {
  const s = Math.min(240 / W, 170 / H), ox = 62, oy = 30, P = (x, y) => [ox + x * s, oy + y * s];
  let g = S.note + S.poly([P(0, 0), P(a, 0), P(a, H - b), P(W, H - b), P(W, H), P(0, H)]);
  g += S.t(ox + a * s / 2, oy - 8, `${a} ${u}`) + S.t(ox - 8, oy + H * s / 2 + 4, `${H} ${u}`, 'end') +
    S.t(ox + W * s / 2, oy + H * s + 20, `${W} ${u}`) + S.t(ox + W * s + 8, oy + (H - b / 2) * s + 4, `${b} ${u}`, 'start');
  return S.wrap(ox + W * s + 64, oy + H * s + 32, g, 'L-shaped plan');
}
function dTri(b, h, u) {
  const s = Math.min(240 / b, 150 / h), ox = 30, oy = 24, B = b * s, Hh = h * s, ax = ox + B * 0.32;
  let g = S.note + S.poly([[ox, oy + Hh], [ox + B, oy + Hh], [ax, oy]]);
  g += S.line(ax, oy, ax, oy + Hh, 'dash') + `<polyline points="${rd(ax, 1)},${rd(oy + Hh - 10, 1)} ${rd(ax + 10, 1)},${rd(oy + Hh - 10, 1)} ${rd(ax + 10, 1)},${rd(oy + Hh, 1)}" class="edge thin"/>`;
  g += S.t(ox + B / 2, oy + Hh + 20, `${fmt(b)} ${u}`) + S.t(ax + 14, oy + Hh / 2, `${fmt(h)} ${u}`, 'start');
  return S.wrap(ox + B + 30, oy + Hh + 30, g, 'triangle');
}
function dCircle(v, isD, u) {
  const r = 70, cx = 100, cy = 90;
  let g = S.note + `<circle cx="${cx}" cy="${cy}" r="${r}" class="shape"/><circle cx="${cx}" cy="${cy}" r="3" class="dot"/>`;
  if (isD) g += S.line(cx - r, cy, cx + r, cy, 'edge') + S.t(cx, cy - 8, `${fmt(v)} ${u}`);
  else g += S.line(cx, cy, cx + r, cy, 'edge') + S.t(cx + r / 2, cy - 8, `${fmt(v)} ${u}`);
  return S.wrap(200, 180, g, 'circle');
}
function dSemiRect(l, w, u) {
  const s = Math.min(200 / l, 120 / w), ox = 60, oy = 26, L = l * s, Wd = w * s, r = Wd / 2;
  let g = S.note + `<path d="M${ox},${oy} H${rd(ox + L, 1)} A${rd(r, 1)},${rd(r, 1)} 0 0 1 ${rd(ox + L, 1)},${rd(oy + Wd, 1)} H${ox} Z" class="shape"/>`;

<h3>Ordering numbers</h3>

/* ---------------- Percentages ---------------- */
function pctSteps(p, a) {
  const ten = a / 10, s = [`10% of ${fmt(a)} = ${fmt(ten)}`];
  if (p === 25 || p === 75) { s.length = 0; s.push(`25% is a quarter: ${fmt(a)} ÷ 4 = ${fmt(a / 4)}`); if (p === 75) s.push(`75% = 3 × 25% = ${fmt(a * 0.75)}`); return s; }
  if (p % 10 === 0) { s.push(`${p}% = ${p / 10} × 10% = ${fmt(ten * p / 10)}`); return s; }
  s.push(`5% is half of 10% = ${fmt(ten / 2)}`);
  if (p > 5) s.push(`${p - 5}% = ${(p - 5) / 10} × 10% = ${fmt(ten * (p - 5) / 10)}`, `${p}% = ${fmt(ten * (p - 5) / 10)} + ${fmt(ten / 2)} = ${fmt(a * p / 100)}`);
  return s;
}

<ol class="steps"><li>Add the parts: 4 : 5 → 9 parts</li><li>Find one part: £360 ÷ 9 = £40</li><li>Multiply: 4 × £40 = £160 and 5 × £40 = £200</li><li>Check they add up: £160 + £200 = £360 ✓</li></ol>
<h3>Direct proportion: the unitary method</h3>
<p>Find the amount for <b>one</b>, then scale up. A recipe for 4 uses 300 g flour. For 1: 300 ÷ 4 = 75 g. For 10: 75 × 10 = <b>750 g</b>.</p>
<h3>Inverse proportion</h3><p>More workers means less time. 4 people take 6 hours = 24 “person-hours”. 3 people: 24 ÷ 3 = <b>8 hours</b>.</p>

<h3>Minutes are not decimals</h3>
<div class="key"><p>2 hours 15 minutes is <b>2.25 hours</b>, not 2.15. Divide the minutes by 60: 15 ÷ 60 = 0.25.<br>1.5 hours is 1 hour <b>30</b> minutes, not 1 hour 50.</p></div>
<div class="tw"><table class="qt"><thead><tr><th>Minutes</th><th>15</th><th>20</th><th>30</th><th>40</th><th>45</th></tr></thead><tbody><tr><th>Hours</th><td>0.25</td><td>0.333…</td><td>0.5</td><td>0.666…</td><td>0.75</td></tr></tbody></table></div>

   HANDLING DATA topics

function modeList(n, lo, hi) { // list with exactly one mode
  let v; do {
    v = []; for (let i = 0; i < n - 1; i++) v.push(R.int(lo, hi));
    v.push(R.pick(v));
    const c = {}; v.forEach(x => c[x] = (c[x] || 0) + 1);
    const top = Math.max(...Object.values(c));
    if (Object.values(c).filter(x => x === top).length === 1) return R.shuffle(v);
  } while (true);
}
function statsOf(v) {
  const s = v.slice().sort((a, b) => a - b), n = s.length, sum = s.reduce((a, b) => a + b, 0);
  const med = n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
  const c = {}; s.forEach(x => c[x] = (c[x] || 0) + 1); const top = Math.max(...Object.values(c));
  const mode = +Object.keys(c).find(k => c[k] === top);
  return { s, n, sum, mean: sum / n, med, mode, range: s[n - 1] - s[0] };
}

/* ---------- progress (kept in this browser) ---------- */

/* ---------- question rendering ---------- */

  if (p.type === 'hm') return `<div class="ans hm"><input id="${id}h" class="inp short" type="text" inputmode="numeric" autocomplete="off" aria-label="hours"><span class="suf">hours</span><input id="${id}m" class="inp short" type="text" inputmode="numeric" autocomplete="off" aria-label="minutes"><span class="suf">minutes</span></div>`;

/* ---------- practice engine ---------- */
function practice(el, cfg) {

  $$('.answerline', el).forEach(a => a.remove());

let MOCK = null, TIMER = null;
function loadMock() { try { const m = JSON.parse(localStorage.getItem(KEY + '-mock')); if (m && m.stage) return m; } catch (e) { } return null; }
function saveMock() { try { if (MOCK) localStorage.setItem(KEY + '-mock', JSON.stringify(MOCK)); else localStorage.removeItem(KEY + '-mock'); } catch (e) { } }
function buildSection(calc, target, maxQ) {
  // topics drawn in proportion to the marks they carry in real TQUK papers; the biggest ones can come up twice
  const wf = calc === false ? t => SEC_A_W[t.id] || 0.3 : t => Math.max(0.3, examW(t.id) - (SEC_A_W[t.id] || 0));
  const cap = t => (calc === false ? (SEC_A_W[t.id] || 0) >= 3 : tierOf(t.id) === 1) ? 2 : 1;
  const pool = TOPICS.filter(t => calc !== false || t.gens.some(g => !g.c));
  const qs = []; let marks = 0, guard = 0;
  while (marks < target && qs.length < maxQ && guard++ < 300) {
    const t = weightedOrder(pool, wf)[0], n = qs.filter(q => q.topic === t.id).length;
    if (n >= cap(t)) continue;
    const q = calc === false ? makeQ(t, false) : (makeQ(t, true, { exam: n === 0 }) || makeQ(t, undefined, { exam: n === 0 }));
    if (!q) continue;
    q.calc = calc !== false; qs.push(q); marks += qMarks(q);
  }
  return qs.sort((a, b) => qMarks(a) - qMarks(b)); // short questions first, like the real paper
}
function weightedOrder(list, wf) {

}

function tick() {

  el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} left`;
  el.classList.toggle('low', left < 300);

function endSection() {

  </form><div id="sheetout"></div>`, 'sheets');
  $('#top6').onclick = () => { const top = byWeight().filter(t => tierOf(t.id) === 1).map(t => t.id); $$('input[name=t]').forEach(x => { x.checked = top.includes(x.value); }); $$('.all').forEach(x => { x.checked = false; }); };
  $$('.all').forEach(c => c.onchange = () => $$(`input[name=t]`).forEach(x => { if (topicById(x.value).area === c.dataset.a) x.checked = c.checked; }));
  $('#sf').onsubmit = e => {
    e.preventDefault();
    let ids = $$('input[name=t]:checked').map(x => x.value);
    const out = $('#sheetout');
    if (!ids.length) { out.innerHTML = '<p class="note">Tick at least one topic.</p>'; return; }
    const calc = { any: undefined, nc: false, c: true }[$('#calc').value];
    const usable = ids.map(topicById).filter(t => calc === undefined || t.gens.some(g => g.c === calc));
    if (!usable.length) { out.innerHTML = `<p class="note">None of those topics have ${calc ? 'calculator' : 'no-calculator'} questions. Choose “Mixed”, or other topics.</p>`; return; }
    const n = +$('#cnt').value, qs = []; let pool = [];
    for (let i = 0; i < n; i++) { if (!pool.length) pool = R.shuffle(usable); qs.push(makeQ(pool.shift(), calc)); }
    const withAns = $('#ans').checked, withSol = $('#sol').checked;
    const html = `<div class="sheet"><div class="sheethead"><div><h1>Functional Maths Level 2 · Practice</h1><p class="sheetsub">${[...new Set(qs.map(q => topicById(q.topic).name))].join(' · ')}</p></div><div class="namebox">Name ____________________<br>Date ____________________</div></div>
      ${qs.map((q, i) => `<div class="pq-print"><p class="qno">Question ${i + 1} <span>${q.calc ? 'Calculator allowed' : 'No calculator'} · ${qMarks(q)} mark${qMarks(q) > 1 ? 's' : ''}</span></p>${q.stem}${q.parts.map((p, j) => `<p class="ppart">${q.parts.length > 1 ? `(${'abcdef'[j]}) ` : ''}${p.q}</p>${p.type === 'choice' ? `<ul class="choicelist">${p.options.map(x => `<li>${x}</li>`).join('')}</ul>` : p.type === 'decide' ? printDecide(p) : ''}`).join('')}<div class="workspace"></div><p class="ansline">Answer${q.parts.length > 1 ? 's' : ''}: ____________________________</p></div>`).join('')}
      ${withAns ? `<div class="answers"><h2>Answers</h2>${qs.map((q, i) => `<div class="ansitem"><p class="qno">Question ${i + 1}: ${q.parts.map((p, j) => (q.parts.length > 1 ? `(${'abcdef'[j]}) ` : '') + showAns(p)).join(' · ')}</p>${withSol ? `<ol class="wsteps">${q.steps.map(s => `<li>${s}</li>`).join('')}</ol>` : ''}</div>`).join('')}</div>` : ''}
      <p class="sheetfoot">Version ${VERSION}</p></div>`;
    out.innerHTML = `<div class="actions"><button class="btn primary" id="print">Print worksheet</button><button class="btn ghost" id="remake">New questions</button></div><div class="preview">${html}</div>`;
    $('#print').onclick = () => printHTML(html);
    $('#remake').onclick = () => $('#sf').requestSubmit();
    out.scrollIntoView({ behavior: 'smooth' });
  };
}

/* ---------- exam toolkit ---------- */
function pToolkit() {
  setPage(`<section class="hero small"><p class="eyebrow">Exam toolkit</p><h1>Before the exam</h1><p class="lede">How the paper works, the formulae to learn, and how to pick up every mark you can.</p></section>
  <div class="learn toolkit">
  <h3>The exam</h3>
  <div class="tw"><table class="qt"><tbody>
  <tr><th>Section A</th><td>No calculator. Around a quarter of the marks. Short questions on number skills: written methods, fractions, percentages, rounding, reading tables.</td></tr>
  <tr><th>Section B</th><td>Calculator allowed. Around three quarters of the marks. Longer real-life problems that mix topics, often ending with a decision.</td></tr>
  <tr><th>Format</th><td>On paper or on screen, depending on your centre. On screen, there is a built-in calculator for Section B, and you type working into answer boxes.</td></tr>
  <tr><th>Timing</th><td>Commonly about 30 minutes for Section A and about 90 minutes for Section B. Check the exact times with your provider.</td></tr></tbody></table></div>
  <h3>Where the marks are</h3>
  <p>Average marks per 60-mark paper, from five real TQUK Level 2 papers. The pass mark on those papers was 34 or 35.</p>
  <div class="tw"><table class="qt"><thead><tr><th>Topic</th><th>Marks per paper</th></tr></thead><tbody>${byWeight().map(t => `<tr><th><a href="#t/${t.id}">${t.name}</a></th><td>${examW(t.id) ? fmt(examW(t.id)) : '0'}</td></tr>`).join('')}</tbody></table></div>
  <h3>Questions TQUK sets again and again</h3>
  <ul><li><b>The last question (about 6 marks):</b> the area of a floor, garden or patio, an average (median or mode) from a price list, then the cost of the job and whether the budget is enough.</li>
  <li><b>Formula with a decision (about 5 marks):</b> work something out (often a volume or a time), put it into a formula you are given, then decide.</li>
  <li><b>Comparing data (about 4 marks):</b> work out the mean and range for two groups and say whether two claims are right.</li>
  <li><b>Contexts that keep coming back:</b> tins of paint (round up), savings with compound interest, fencing round a circular pond, sale signs, recipes.</li></ul>
  <div class="tip"><strong>“Is it correct? Show how you decide.”</strong> About 7 marks a paper hang on a decision. Always write <b>Yes or No</b> and <b>the number that proves it</b>: “No. The paint costs £148.50, which is more than £140.” A yes or no on its own gets no marks.</div>
  <h3>How to answer a real-life problem</h3>
  <ol class="steps"><li><b>Read</b> the whole question twice. Underline the numbers and what it actually asks.</li><li><b>Plan</b>: what do I need to work out first? Write a short list.</li><li><b>Calculate</b>, writing every step with a label (“Cost of paint = …”).</li><li><b>Check</b>: does it make sense? Estimate, or work backwards.</li><li><b>Answer the question</b> in words, with units: “Yes, she can afford it. She will have £12.40 left.”</li></ol>
  <div class="tip"><strong>Most marks are for working.</strong> A wrong final answer with clear working can still earn most of the marks. A right answer with no working may get only one.</div>
  <h3>Formulae you must remember</h3>
  <div class="tw"><table class="qt"><tbody>
  <tr><th>Area of a rectangle</th><td>length × width</td></tr><tr><th>Area of a triangle</th><td>½ × base × height</td></tr>
  <tr><th>Area of a circle</th><td>π × r²</td></tr><tr><th>Circumference</th><td>π × d</td></tr>
  <tr><th>Volume of a cuboid</th><td>length × width × height</td></tr><tr><th>Volume of a cylinder</th><td>π × r² × h</td></tr>
  <tr><th>Mean</th><td>total ÷ how many</td></tr><tr><th>Range</th><td>largest − smallest</td></tr>
  <tr><th>Speed</th><td>distance ÷ time</td></tr><tr><th>Density</th><td>mass ÷ volume</td></tr>
  <tr><th>Percentage change</th><td>change ÷ original × 100</td></tr><tr><th>Probability</th><td>ways it can happen ÷ total outcomes</td></tr></tbody></table></div>
  <p>Formulae for other shapes (such as a trapezium, prism, cone or sphere) are given in the question.</p>
  <h3>Units to know</h3>
  <div class="tw"><table class="qt"><tbody><tr><th>Length</th><td>10 mm = 1 cm · 100 cm = 1 m · 1,000 m = 1 km</td></tr><tr><th>Mass</th><td>1,000 g = 1 kg · 1,000 kg = 1 tonne</td></tr><tr><th>Capacity</th><td>1,000 ml = 1 litre · 1 cm³ = 1 ml · 1 m³ = 1,000 litres</td></tr><tr><th>Time</th><td>60 minutes = 1 hour · 15 min = 0.25 h · 20 min = ⅓ h · 30 min = 0.5 h · 45 min = 0.75 h</td></tr></tbody></table></div>
  <h3>Calculator tips</h3>
  <ul><li>Use brackets: (45 + 30) × 2 is not the same as 45 + 30 × 2.</li><li>Use the π button.</li><li>Never type 2.15 for 2 hours 15 minutes. Type 2.25, or 2 + 15 ÷ 60.</li><li>Money answers: if the display shows 4.5, write £4.50.</li><li>Write down the full calculator display before rounding, then round.</li></ul>
  <h3>Common slips</h3>
  <ul><li>Adding the bottom numbers of fractions.</li><li>Dividing by the new amount instead of the original for percentage change.</li><li>Adding 20% back on for reverse percentages, instead of dividing by 0.8.</li><li>Forgetting to round <b>up</b> for things like packs, coaches or tins.</li><li>Using the diameter instead of the radius in π × r².</li><li>Mixing units: cm with m, minutes with hours.</li><li>Not answering the actual question: giving the total when it asked for the change.</li></ul>
  <h3>On the day</h3>
  <ul><li>Bring two black pens, a pencil, rubber, ruler, protractor and calculator (check your centre allows your model).</li><li>Start with questions you can do, then go back.</li><li>Keep an eye on the clock: roughly two minutes per mark.</li><li>Leave nothing blank. Write down any method you can.</li></ul>
  </div>`, 'toolkit');
}

/* ---------- router ---------- */
function route() {
  clearInterval(TIMER);
  const [page, a, b] = (location.hash.slice(1) || 'home').split('/');
  if (page === 't') return pTopic(a, b);
  if (page === 'checkup') return pCheckup();
  if (page === 'quick') return pQuick();
  if (page === 'mock') return pMock();
  if (page === 'sheets') return pSheets();
  if (page === 'toolkit') return pToolkit();
  pHome();
}
window.addEventListener('hashchange', route);
document.addEventListener('DOMContentLoaded', () => {
  $('#ver').textContent = VERSION;
  $('#reset').onclick = () => {
    const box = $('#resetbox');
    box.innerHTML = `<span>Clear all progress, check-up and mock results on this device?</span> <button class="btn small danger" id="ry">Yes, clear it</button> <button class="btn small ghost" id="rn">Cancel</button>`;
    $('#ry').onclick = () => { P = { t: {}, checkup: null, mocks: [], exam: '' }; saveP(); MOCK = null; saveMock(); box.textContent = 'Progress cleared.'; route(); };
    $('#rn').onclick = () => { box.innerHTML = ''; };
  };
  route();
});
